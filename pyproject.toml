[project]
name = "ha-tam-montpellier"
version = "0.9.1"
description = "Home Assistant integration for the Montpellier tramway (TaM) real-time departures"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "custom_components", "tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Generated protobuf code, without type hints.
module = ["google.transit.*", "google.protobuf.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components.tam_montpellier"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
