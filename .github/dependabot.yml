version: 2
updates:
  # Actions used by the Validate and Tests workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Test dependencies. The runtime requirement lives in manifest.json, which
  # Dependabot does not read: keep gtfs-realtime-bindings in sync by hand.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # Must match the protobuf shipped by Home Assistant: majors wait for HA.
    ignore:
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gtfs-realtime-bindings"
        update-types: ["version-update:semver-major"]
    groups:
      test-deps:
        patterns: ["*"]
