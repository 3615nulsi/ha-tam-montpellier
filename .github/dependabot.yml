version: 2
updates:
  # Actions used by the Validate and Tests workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Test dependencies. The runtime requirement lives in manifest.json, which
  # Dependabot does not read: keep gtfs-realtime-bindings in sync by hand.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      test-deps:
        patterns: ["*"]
