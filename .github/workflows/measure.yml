name: Measure (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install $(jq -r '.requirements[]' custom_components/tam_montpellier/manifest.json)
      - run: python scripts/measure_static.py
      - run: curl -sI https://gtfsproxy.e-tam.fr/COMMON/GTFS.zip
