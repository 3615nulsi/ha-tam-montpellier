name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements_test.txt ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Run tests
        run: python -m pytest -q
