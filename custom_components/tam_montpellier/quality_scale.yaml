# Self-assessment against the Home Assistant integration quality scale.
# Not checked by hassfest for a custom integration: kept up to date by hand.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Real-time feeds every 30 s, timetables once a night.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >
      Departures fall back to the timetables when the real-time feed fails,
      by design; the trams in service become unavailable.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The TaM open data feeds need no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud service, nothing to discover on the network.
  discovery-update-info:
    status: exempt
    comment: A cloud service, nothing to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: A service integration, without physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: todo
    comment: >
      Giving categories to existing sensors changes how they are shown:
      left to a decision of the maintainer.
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: >
      The only dependency decodes protobuf messages, run in the executor;
      all network access uses the aiohttp session of Home Assistant.
  inject-websession: done
  strict-typing: done
